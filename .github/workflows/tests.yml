name: tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Import check
        run: python -c "import annotuneagent; print(annotuneagent.__version__)"

      - name: Tests
        run: pytest -q --cov=annotuneagent --cov-report=term-missing

  scfair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,scfair]"
      # importorskip would hide a failed install, so check the import first.
      - run: python -c "import scfair"
      - run: pytest -q tests/test_prepare.py -k scfair -rs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install "ruff>=0.4.0,<0.17"
      - run: ruff check src tests
      - run: ruff format --check src tests

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --sdist --wheel
      - name: Check runtime data in release archives
        run: |
          python - <<'PY'
          from pathlib import Path
          from tarfile import open as open_tar
          from zipfile import ZipFile

          names = {"LICENSE", "merges.txt", "tokenizer.json", "tokenizer_config.json", "vocab.json"}
          ontology = {"cl_isa.json", "ontology_map.jsonl", "granularity_policy.yaml"}
          wheel = next(Path("dist").glob("*.whl"))
          source = next(Path("dist").glob("*.tar.gz"))
          with ZipFile(wheel) as archive:
              metadata = next(name for name in archive.namelist() if name.endswith(".dist-info/METADATA"))
              assert "Requires-Dist: scikit-misc>=0.1.4" in archive.read(metadata).decode()
              actual = {Path(name).name for name in archive.namelist() if name.startswith("annotuneagent/tokenizer/")}
              assert actual == names, (wheel, actual)
              actual = {Path(name).name for name in archive.namelist() if name.startswith("annotuneagent/ontology/")}
              assert actual == ontology, (wheel, actual)
          with open_tar(source) as archive:
              actual = {Path(name).name for name in archive.getnames() if "/src/annotuneagent/tokenizer/" in name}
              assert actual == names, (source, actual)
              actual = {Path(name).name for name in archive.getnames() if "/src/annotuneagent/ontology/" in name}
              assert actual == ontology, (source, actual)
          PY
