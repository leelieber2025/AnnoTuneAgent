[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "annotuneagent"
dynamic = ["version"]
description = "Cluster-level cell-type annotation from marker, name, and ML results"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Zhao Li (李钊)", email = "leelieber@gmail.com"}
]
keywords = [
    "single-cell",
    "RNA-seq",
    "cell type annotation",
    "marker genes",
    "bioinformatics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "anndata>=0.11.3",
    "numpy>=1.23",
    "pandas>=1.4",
    "scipy>=1.7",
    "scanpy[leiden]>=1.10",
    "scikit-misc>=0.1.4",
    "numba>=0.57",
    "scikit-learn>=1.1",
    "matplotlib>=3.6",
    "pyyaml>=6",
]

[project.optional-dependencies]
scvi = [
    "scvi-tools>=1.1.3",
]
models = [
    "transformers",
]
scfair = [
    "scfair>=0.8",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0,<0.17",
]
docs = [
    "sphinx>=7.0",
    "sphinx-book-theme>=1.1",
    "myst-nb>=1.0",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.5",
]

[project.scripts]
annotuneagent = "annotuneagent.cli:main"

[project.urls]
Homepage = "https://github.com/leelieber2025/AnnoTuneAgent"
Documentation = "https://annotuneagent.readthedocs.io/"
Changelog = "https://github.com/leelieber2025/AnnoTuneAgent/blob/main/CHANGELOG.md"
Source = "https://github.com/leelieber2025/AnnoTuneAgent"
Issues = "https://github.com/leelieber2025/AnnoTuneAgent/issues"
PyPI = "https://pypi.org/project/annotuneagent/"
Zenodo = "https://doi.org/10.5281/zenodo.24092828"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
annotuneagent = ["py.typed", "markers.tsv", "tokenizer/*", "ontology/*"]

[tool.setuptools.dynamic]
version = {attr = "annotuneagent._version.__version__"}

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["scripts", "data", "docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["annotuneagent"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --tb=short"
